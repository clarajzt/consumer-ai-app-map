<style>

.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--mut); }

.top-nav { position: sticky; top: 0; z-index: 9; display: flex; align-items: center; gap: 20px; padding: 11px 24px;
  background: rgba(242,239,230,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-weight: 600; font-size: 14px; letter-spacing: .06em;
  text-transform: uppercase; white-space: nowrap; background: none; border: 0; padding: 0; cursor: pointer; }
.logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 3px rgba(231,50,92,.22); }

.top-nav nav button[aria-current="page"], .top-nav nav button:hover { color: var(--ink); background: var(--soft); }

.hero[hidden], .note[hidden] { display: none; }
.hero { padding: 40px 0 8px; display: grid; grid-template-columns: 7fr 5fr; gap: 40px; align-items: end; }
.kicker { font-family: var(--mono); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--signal); margin: 0 0 12px; }
.hero h1 { font-size: clamp(34px, 4.6vw, 52px); line-height: 1.04; margin: 0; letter-spacing: -.01em; font-weight: 600; text-wrap: balance; }

.tile.shine { background: var(--card); background-image: var(--shine); }
.tl { margin: 0; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
.tv { margin: 3px 0 0; font-family: var(--disp); font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tv small { font-size: 13px; font-weight: 500; color: var(--mut); font-family: var(--mono); margin-left: 4px; }
.note { margin: 22px 0 0; padding: 11px 16px; background: var(--soft); border-left: 3px solid var(--signal); border-radius: 0 10px 10px 0; font-size: 13px; color: var(--body-mut); }

.block { margin: 44px 0 0; }
.block > h2 { font-size: 22px; margin: 0 0 4px; font-weight: 600; letter-spacing: -.01em; }
.sub-note { color: var(--mut); font-size: 13px; margin: 0 0 14px; max-width: 78ch; }
.card { background: var(--card); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line), var(--shadow-soft); overflow: hidden; }
.scroll { overflow-x: auto; }

table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { font-family: var(--mono); text-align: left; color: var(--mut); font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
  padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--soft); white-space: nowrap; }
th.r, td.r { text-align: right; }
th button { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }

td { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--paper); }
tr.layer td { background: var(--paper); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); padding: 7px 12px; }
tr.layer td::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--c); margin-right: 8px; vertical-align: -1px; }
.bar { display: inline-block; height: 7px; border-radius: 999px; background: var(--c, var(--chrome)); vertical-align: middle; min-width: 2px; opacity: .85; }
.seg-name { font-weight: 600; }
.lead { color: var(--body-mut); }
.pill { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 5px; background: var(--soft); color: var(--mut); white-space: nowrap; }
.pill.new { background: rgba(76,95,213,.14); color: var(--chrome); }
.pill.watch { background: none; box-shadow: inset 0 0 0 1px var(--line); }
.pill.inc { background: none; box-shadow: inset 0 0 0 1px var(--line); font-style: italic; }
.pill.g { font-weight: 600; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.list h3 { margin: 0; padding: 12px 14px 10px; font-size: 14.5px; font-weight: 600; border-bottom: 1px solid var(--line-soft); display: flex; gap: 8px; align-items: baseline; }
.list h3 span { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--mut); }
.row { display: grid; grid-template-columns: 22px minmax(0, 1.5fr) minmax(0, 1fr) 64px 110px; gap: 10px; align-items: center; padding: 7px 14px;
  border-bottom: 1px solid var(--line-soft); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; font-size: 13.5px; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--paper); }
.row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sg { color: var(--mut); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.mom { display: flex; align-items: center; gap: 6px; justify-content: flex-end; font-size: 12px; }
.mom i { display: block; height: 6px; border-radius: 999px; background: currentColor; opacity: .8; }
.lg { width: 20px; height: 20px; border-radius: 5px; object-fit: contain; background: #fff; box-shadow: 0 0 0 1px var(--line-soft); flex: 0 0 auto; }
.lg.ph { display: inline-block; background: var(--soft); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.ncard { text-align: left; border: 0; cursor: pointer; background: var(--card); border-radius: 14px; padding: 14px 16px; box-shadow: inset 0 0 0 1px var(--line), var(--shadow-soft); }
.ncard:hover { box-shadow: inset 0 0 0 1px var(--chrome), var(--shadow-soft); }
.ncard .h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ncard .h b { font-family: var(--disp); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ncard .h .pill { margin-left: auto; }
.ncard p { margin: 0; font-size: 12.5px; color: var(--body-mut); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.grades { display: flex; height: 12px; border-radius: 999px; overflow: hidden; margin: 2px 0 10px; }
.grades i { display: block; }
.gl { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--body-mut); }
.gl b { font-family: var(--mono); }

.tools { display: flex; gap: 10px 12px; align-items: center; flex-wrap: wrap; margin: 0 0 16px; }
.search { flex: 1 1 240px; max-width: 340px; }
.search input { width: 100%; padding: 8px 14px; border: 0; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line), var(--shadow-soft); font-size: 14px; }
.seg { display: inline-flex; gap: 3px; font-family: var(--mono); flex-wrap: wrap; }
.seg button { height: 28px; border: 0; background: var(--soft); color: var(--mut); border-radius: 7px; padding: 0 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.check { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--mut); cursor: pointer; user-select: none; white-space: nowrap; }
.spacer { flex: 1; }
.count { font-family: var(--mono); font-size: 12px; color: var(--mut); }

.layer-sec + .layer-sec { margin-top: 36px; }
.layer-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
.layer-h h3 { font-size: 19px; margin: 0; font-weight: 600; padding-left: 12px; border-left: 4px solid var(--c); }
.layer-h span { color: var(--mut); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 14px; align-items: start; }
.panel { scroll-margin-top: 70px; }
.panel-h { display: flex; align-items: center; gap: 8px; padding: 11px 14px 4px; font-family: var(--disp); font-weight: 600; font-size: 14.5px; }
.panel-h::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: 0 0 auto; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px 12px; }

a.chip { text-decoration: none; }
nav[hidden] { display: none; }
.chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.chip .v { font-family: var(--mono); font-size: 10.5px; color: var(--mut); }

.more { border: 0; background: none; color: var(--chrome); cursor: pointer; font-family: var(--mono); font-size: 11.5px; padding: 0 4px; height: 28px; }
.legend { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; font-size: 12px; color: var(--mut); }
.legend .chip { cursor: default; }
.empty { color: var(--mut); padding: 40px 0; text-align: center; font-family: var(--mono); font-size: 13px; }

aside.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--card); background-image: var(--shine);
  box-shadow: -1px 0 0 var(--line), var(--shadow); transform: translateX(105%); transition: transform .2s ease; z-index: 20; display: flex; flex-direction: column; }

.dbody { padding: 16px 22px 28px; overflow-y: auto; }
.tstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 16px; }
.tstats .tile { padding: 9px 11px; }
.tstats .tv { font-size: 19px; }
.dlinks { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
.btn { background: linear-gradient(180deg, #fff 0%, #E7E9FA 45%, #C3CBF7 55%, #F1F2FB 100%); padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--line), var(--shadow-soft); }
dl { margin: 0; display: grid; grid-template-columns: 104px 1fr; gap: 9px 12px; font-size: 13.5px; }
dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); padding-top: 3px; }
dd { margin: 0; overflow-wrap: anywhere; }
.warn { margin: 0 0 14px; padding: 9px 12px; border-radius: 10px; background: rgba(231,50,92,.07); box-shadow: inset 0 0 0 1px rgba(231,50,92,.35); font-size: 12.5px; color: var(--body-mut); }
.scrim { position: fixed; inset: 0; background: rgba(23,26,43,.18); z-index: 15; display: none; }
.scrim.open { display: block; }
footer { max-width: 1280px; margin: 0 auto; padding: 26px 24px 40px; color: var(--mut); font-size: 12.5px; border-top: 1px solid var(--line); }

@media (max-width: 900px) { .hero { grid-template-columns: 1fr; gap: 22px; padding-top: 28px; } .two { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  main, .top-nav, footer { padding-left: 16px; padding-right: 16px; }
  .top-nav { gap: 10px; flex-wrap: wrap; } .asof { display: none; }
  .grid { grid-template-columns: 1fr; }
  .row { grid-template-columns: 22px minmax(0, 1fr) 56px 84px; } .row .sg { display: none; }
  .search { max-width: none; }
  .tstats { grid-template-columns: 1fr 1fr; }
}
.spark { display: block; width: 100%; height: 64px; margin: 0 0 14px; }
.spark path.l { fill: none; stroke: var(--chrome); stroke-width: 2; }
.spark path.a { fill: rgba(76,95,213,.10); stroke: none; }
.spark text { font-family: var(--mono); font-size: 9px; fill: var(--mut); }
.tstats.four { grid-template-columns: repeat(4, 1fr); }
.pill.pend { background: rgba(201,154,46,.18); color: #8a6412; }
.stub { margin: 18px 0 0; padding-top: 12px; border-top: 1px solid var(--line-soft); font-size: 12.5px; color: var(--mut); }
.stub button { border: 0; background: var(--soft); border-radius: 7px; padding: 4px 10px; font-family: var(--mono); font-size: 11.5px; cursor: pointer; color: var(--ink); margin-left: 6px; }
.chip .rk { font-family: var(--mono); font-size: 10px; color: var(--mut); }
.row.r5 { grid-template-columns: 22px minmax(0, 1.4fr) minmax(0, 1fr) 56px 64px 64px; }
.row .c { text-align: right; font-size: 12px; }
@media (max-width: 760px) { .row.r5 { grid-template-columns: 22px minmax(0, 1fr) 52px 60px; } .row.r5 .c.x { display: none; } .tstats.four { grid-template-columns: 1fr 1fr; } }
</style>

<script>
(() => {
  "use strict";
  const D = JSON.parse(document.getElementById("data").textContent);
  const R = D.records, L = D.layers, LK = Object.keys(L), SIG = D.signals, T = D.traffic;
  const byId = new Map(R.map(r => [r.id, r]));
  const PUB = D.public;                       // the public page is the map alone
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "style") n.style.cssText = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c instanceof Node ? c : String(c));
    return n;
  };
  const svg = (tag, attrs, ...kids) => {
    const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
    for (const c of kids) n.append(c instanceof Node ? c : String(c));
    return n;
  };
  const human = n => {
    if (n == null) return "";
    for (const [lim, s] of [[1e9, "B"], [1e6, "M"], [1e3, "K"]])
      if (n >= lim) { const v = n / lim; return (v < 10 ? v.toFixed(1) : v.toFixed(0)).replace(/\.0$/, "") + s; }
    return String(Math.round(n));
  };
  const pct = m => m == null ? "" : (m > 0 ? "+" : "") + (Math.abs(m) >= 10 ? m.toFixed(0) : m.toFixed(1)) + "%";

    S.p = !PUB && byId.has(h.get("p")) ? h.get("p") : "";
  };
  const writeHash = () => {
    const h = new URLSearchParams();
    if (S.v !== "brief" && !PUB) h.set("v", S.v);
    if (S.layer !== "all") h.set("layer", S.layer);
    if (S.seg) h.set("seg", S.seg);
    if (S.q) h.set("q", S.q);
    if (S.s !== "all") h.set("s", S.s);
    if (S.o !== "all") h.set("o", S.o);
    if (!S.inc) h.set("inc", "0");
    if (S.traf) h.set("traf", "1");
    if (S.p) h.set("p", S.p);
    const next = h.toString();
    if (next !== location.hash.slice(1)) history.replaceState(null, "", next ? "#" + next : location.pathname + location.search);
  };
  const visible = () => {
    const words = S.q.toLowerCase().split(/\s+/).filter(Boolean);
    return R.filter(r => (S.layer === "all" || r.layer === S.layer) && (!S.seg || r.segment === S.seg) &&
      (S.s === "all" || r.status === S.s) && (S.o === "all" || r.origin === S.o) && (S.inc || r.kind !== "incumbent") &&
      (!S.traf || r.visits != null) && words.every(w => r._hay.includes(w)));
  };
  const go = patch => { Object.assign(S, patch); render(); };
  const open = id => go({ p: id });

  // ---------- hero
  const apps = R.filter(r => r.layer !== "device"), devices = R.length - apps.length;
  const total = R.filter(own).reduce((a, r) => a + r.visits, 0);
  $("asof").textContent = `traffic ${T.period} · data read ${D.snapshot} · built ${D.built}`;
  $("lede").textContent = `${apps.length} consumer AI apps and ${devices} devices, filed by the job people hire them for. ` + (PUB
    ? `Each app shows its ${T.period} website traffic, with an arrow where it moved more than 10% in the month.`
    : null);
  const tile = (label, value, small, cls) => el("div", { class: `tile ${cls || ""}` }, el("p", { class: "tl" }, label),
    el("p", { class: "tv" }, value, small ? el("small", null, small) : null));
  $("tiles").replaceChildren(
    tile("Apps · devices", `${apps.length} · ${devices}`, null, "shine"),
    tile("With traffic this month", R.filter(r => r.traffic_match === "own").length),
    tile("Tracked visits", human(total), T.period),
    PUB ? tile(`New in ${D.windows.new_days} days`, R.filter(r => r.status === "new").length)
      : null);
  $("caveat").textContent = "Traffic is website visits, not app users: mobile-first products are understated" + (PUB ? ". " : null) +
    "Established products whose sites are mostly not AI use are drawn faded and left out of totals, shares and mover lists.";
  $("foot").replaceChildren(`${T.source}. A missing number is a gap in the record, not a zero. `,
    D.repo ? el("a", { href: D.repo + "/issues/new", target: "_blank", rel: "noopener", style: "text-decoration:underline" }, "Suggest a product or a correction") : "");
  const hasWatch = R.some(r => r.status === "watch");

  // ---------- map
  const chip = r => {
    const big = own(r) && r.visits >= 10e6;
    const cls = ["chip", big ? "big" : "", r.status === "listed" ? "" : r.status, r.kind === "incumbent" ? "inc" : "", r.id === S.p ? "sel" : ""].join(" ").replace(/\s+/g, " ").trim();
    const show = r.mom != null && Math.abs(r.mom) >= 10 && r.kind !== "incumbent" && !r.series_break;
    const site = PUB && r.site ? { href: r.site, target: "_blank", rel: "noopener" } : {};
    return el(PUB ? (r.site ? "a" : "span") : "button", { class: cls, style: `--c:${color(r.layer)}` + (PUB && !r.site ? ";cursor:default" : ""), ...site,
      onclick: PUB ? null : () => open(r.id),
      title: [r.name, r.company, r.kind === "incumbent" ? "established product: site traffic is mostly not AI use" : "", r.status === "watch" ? "listed" : ""].filter(Boolean).join(" · ") },
      logo(r.logo), el("span", { class: "nm" }, r.name + (r.status === "watch" ? "*" : "")),
      r.visits != null ? el("span", { class: "v" }, human(r.visits)) : null,
      r.rank ? el("span", { class: "rk" }, "#" + r.rank) : null,
      show ? el("span", { class: `m ${dir(r.mom)}` }, (r.mom > 0 ? "▲" : "▼") + Math.abs(r.mom).toFixed(0)) : null);
  };
  const order = (a, b) => ((b.kind === "ai_native") - (a.kind === "ai_native")) || ((b.visits ?? -1) - (a.visits ?? -1)) ||
    ((a.rank ?? 1e9) - (b.rank ?? 1e9)) || ((b.app_mau?.value ?? -1) - (a.app_mau?.value ?? -1)) ||
    ((b.status === "new") - (a.status === "new")) || (b.added || "").localeCompare(a.added || "") || a.name.localeCompare(b.name);
  const mapView = rows => {
    const filtered = S.q || S.s !== "all" || S.o !== "all" || S.seg || S.traf;
    const out = [el("div", { class: "legend" },
      el("span", { class: "chip big" }, el("span", { class: "lg ph" }), el("span", { class: "nm" }, "10M+ visits"), el("span", { class: "v" }, "41M"), el("span", { class: "m up" }, "▲26")), "month change shown at ±10%",
      el("span", { class: "chip new" }, el("span", { class: "lg ph" }), el("span", { class: "nm" }, "New")), `added in ${D.windows.new_days} days`,
      hasWatch ? el("span", { class: "chip watch" }, el("span", { class: "lg ph" }), el("span", { class: "nm" }, "Listed")) : null,
      el("span", { class: "chip inc" }, el("span", { class: "lg ph" }), el("span", { class: "nm" }, "Established product")), "site traffic mostly not AI")];
    for (const k of LK) {
      const mine = rows.filter(r => r.layer === k);
      if (!mine.length) continue;
      const segs = new Map();
      for (const r of mine) (segs.get(r.segment) || segs.set(r.segment, []).get(r.segment)).push(r);
      const ordered = SIG.board.filter(b => b.layer === k && segs.has(b.segment));
      out.push(el("section", { class: "layer-sec", style: `--c:${color(k)}` },
        el("div", { class: "layer-h" }, el("h3", null, L[k].title), el("span", null, `${L[k].blurb} · ${mine.length} products`)),
        el("div", { class: "grid" }, ordered.map(b => {
          const list = segs.get(b.segment).sort(order);
          const full = filtered || open1.has(b.segment);
          const shown = full ? list : list.slice(0, 14);
          return el("div", { class: "card panel", id: "seg-" + b.segment },
            el("div", { class: "panel-h" }, b.segment),
            el("div", { class: "panel-m" }, [`${list.length} products`, b.visits ? `${human(b.visits)} visits` : "", b.top3_share != null ? `top 3 hold ${b.top3_share}%` : "",
              b.segment_chg3 != null ? `3 mo ${pct(b.segment_chg3)}` : ""].filter(Boolean).join(" · ")),
            el("div", { class: "chips" }, shown.map(chip),
              list.length > shown.length ? el("button", { class: "more", onclick: () => { open1.add(b.segment); render(); } }, `+${list.length - shown.length} more`) : null));
        }))));
    }
    return out;
  };

  // ---------- render
  const seg = (label, opts, cur, set) => el("div", { class: "seg", role: "group", "aria-label": label },
    opts.map(([k, t]) => el("button", { "aria-pressed": String(cur === k), onclick: () => go(set(k)) }, t)));
  const tools = n => el("div", { class: "tools" },
    el("label", { class: "search" }, el("input", { id: "q", type: "search", placeholder: "Search products, companies, segments…", "aria-label": "Search", autocomplete: "off", value: S.q,
      oninput: e => { clearTimeout(tools.t); const v = e.target.value.trim(); tools.t = setTimeout(() => { S.q = v; render(true); }, 140); } })),
    seg("Layer", [["all", "All"], ...LK.map(k => [k, L[k].title])], S.layer, k => ({ layer: k, seg: "" })),
    seg("Status", [["all", "All"], ["new", "New"], ...(hasWatch ? [["watch", "Listed"]] : [])], S.s, k => ({ s: k })),
    PUB ? null : null,
    el("label", { class: "check" }, el("input", { type: "checkbox", checked: S.traf, onchange: e => go({ traf: e.target.checked }) }), "with traffic"),
    el("label", { class: "check" }, el("input", { type: "checkbox", checked: S.inc, onchange: e => go({ inc: e.target.checked }) }), "established products"),
    el("span", { class: "spacer" }),
    S.seg ? el("button", { class: "more", onclick: () => go({ seg: "" }) }, `${S.seg} ✕`) : null,
    el("span", { class: "count" }, `${n} products`));
  const render = keepFocus => {
    for (const b of $("views").children) { if (b.dataset.v === S.v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }
    let kids;
    if (S.v === "brief") kids = null;
    else {
      const rows = visible();
      kids = [el("section", { class: "block" }, el("h2", null, S.v === "map" ? "The map" : null),
        el("p", { class: "sub-note" }, PUB ? "Largest AI-native products first in each segment; devices by research rank."
          : null),
        tools(rows.length), ...(rows.length ? (S.v === "map" ? mapView(rows) : null) : [el("p", { class: "empty" }, "Nothing matches.")]))];
    }
    document.querySelector(".hero").hidden = $("caveat").hidden = S.v !== "brief" && !PUB;
    $("views").hidden = PUB;
    $("body").replaceChildren(...kids);
    if (keepFocus) { const q = $("q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
    if (S.v === "map" && S.seg && !S.p) document.getElementById("seg-" + S.seg)?.scrollIntoView({ block: "start" });
    if (!PUB) null;
    writeHash();
  };
  $("views").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { go({ v: b.dataset.v, p: "" }); scrollTo({ top: 0 }); } });
  $("home").addEventListener("click", () => { go({ v: "brief", layer: "all", seg: "", q: "", s: "all", o: "all", p: "" }); scrollTo({ top: 0 }); });
  $("close")?.addEventListener("click", () => go({ p: "" }));
  $("scrim")?.addEventListener("click", () => go({ p: "" }));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S.p) go({ p: "" }); });
  window.addEventListener("hashchange", () => { readHash(); render(); });
  readHash(); render();
})();
</script>
</body>
</html>
